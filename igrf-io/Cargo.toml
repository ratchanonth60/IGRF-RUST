[package]
name = "igrf-io"
version = "0.4.1"
edition = "2021"

[dependencies]
# Local-date rotation for the CSV logger; "clock" is the cross-platform
# local-time source, so this works the same on Windows and Linux.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
igrf-core = { path = "../igrf-core" }
serialport = "4.9"

ureq = { version = "3.4.0", features = ["json", "cookies"] }
# 64-column-tables: the `tle` table has ~40 columns, one per Space-Track field.
diesel = { version = "2.3", features = ["sqlite", "returning_clauses_for_sqlite_3_35", "64-column-tables"] }
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
